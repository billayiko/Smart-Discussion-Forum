<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd28a" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#ffb84d" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffb84d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c6ef4"/>
      <stop offset="100%" stop-color="#9b6ef4"/>
    </linearGradient>
    <linearGradient id="pageLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="72%" stop-color="#fbf9ff"/>
      <stop offset="100%" stop-color="#e6ddff"/>
    </linearGradient>
    <linearGradient id="pageRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e6ddff"/>
      <stop offset="28%" stop-color="#fbf9ff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="gutter" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8f7fe0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8f7fe0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8f7fe0" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1e1b2e" flood-opacity="0.12"/>
    </filter>
    <filter id="blurSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- warm glow behind the book -->
  <ellipse cx="200" cy="322" rx="170" ry="120" fill="url(#glow)"/>

  <!-- sparkles -->
  <g fill="#ffd28a">
    <path d="M232 252 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z"/>
    <path d="M168 236 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z" opacity="0.9"/>
    <path d="M336 132 l3.5 8 8 3.5 -8 3.5 -3.5 8 -3.5 -8 -8 -3.5 8 -3.5 z" fill="#c9beff"/>
    <path d="M56 104 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z" fill="#c9beff"/>
    <path d="M256 70 l2.5 6 6 2.5 -6 2.5 -2.5 6 -2.5 -6 -6 -2.5 6 -2.5 z" fill="#ffd28a"/>
  </g>

  <!-- orbit ring -->
  <circle cx="200" cy="176" r="118" fill="none" stroke="#c9beff" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round" opacity="0.7"/>

  <!-- book contact shadow -->
  <ellipse cx="200" cy="361" rx="112" ry="11" fill="#1e1b2e" opacity="0.16" filter="url(#blurSoft)"/>

  <!-- open book -->
  <g>
    <!-- stacked page edges (paper thickness) -->
    <path d="M200 300 C 166 289 126 286 94 289" fill="none" stroke="#ded6ff" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
    <path d="M200 303 C 166 292 128 289 97 292" fill="none" stroke="#ded6ff" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
    <path d="M200 300 C 234 289 274 286 306 289" fill="none" stroke="#ded6ff" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
    <path d="M200 303 C 234 292 272 289 303 292" fill="none" stroke="#ded6ff" stroke-width="2" stroke-linecap="round" opacity="0.65"/>

    <!-- main pages -->
    <path d="M200 300 L200 358 C 170 344 128 340 92 348 L92 296 C 128 286 170 288 200 300 Z" fill="url(#pageLeft)" stroke="#e2dafd" stroke-width="1.5"/>
    <path d="M200 300 L200 358 C 230 344 272 340 308 348 L308 296 C 272 286 230 288 200 300 Z" fill="url(#pageRight)" stroke="#e2dafd" stroke-width="1.5"/>

    <!-- gutter shadow where the pages meet -->
    <path d="M184 297 C 192 320 192 337 184 357 L216 357 C 208 337 208 320 216 297 Z" fill="url(#gutter)"/>
    <path d="M200 299 L200 357" stroke="#8f7fe0" stroke-width="1.2" opacity="0.4"/>

    <!-- paper sheen along the top edge -->
    <path d="M104 300 C 132 292 160 293 182 300" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.85" fill="none"/>
    <path d="M296 300 C 268 292 240 293 218 300" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.85" fill="none"/>

    <!-- printed text lines, left page -->
    <path d="M108 312 C 130 308 152 309 172 314" stroke="#cabdf7" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M106 322 C 130 317 156 318 178 324" stroke="#cabdf7" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M108 332 C 128 328 148 329 166 333" stroke="#cabdf7" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.65"/>
    <path d="M110 341 C 128 338 144 339 158 342" stroke="#cabdf7" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>

    <!-- printed text lines, right page -->
    <path d="M292 312 C 270 308 248 309 228 314" stroke="#cabdf7" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M294 322 C 270 317 244 318 222 324" stroke="#cabdf7" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M292 332 C 272 328 252 329 234 333" stroke="#cabdf7" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.65"/>
    <path d="M290 341 C 272 338 256 339 242 342" stroke="#cabdf7" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>
  </g>

  <!-- central purple orb with graduation cap -->
  <circle cx="200" cy="176" r="54" fill="url(#orb)" filter="url(#softShadow)"/>
  <g transform="translate(200 176)">
    <path d="M0 -22 L28 -8 L0 6 L-28 -8 Z" fill="#ffffff"/>
    <path d="M-14 -3 L-14 12 C -14 19 14 19 14 12 L14 -3 L0 4 Z" fill="#ffffff" opacity="0.92"/>
    <path d="M25 -8 L25 8" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="25" cy="11" r="3" fill="#ffffff"/>
  </g>

  <!-- badge: globe (top right) -->
  <g transform="translate(298 84)">
    <circle r="30" fill="#ffffff" filter="url(#softShadow)"/>
    <circle r="16" fill="none" stroke="#14b8a6" stroke-width="2.5"/>
    <ellipse rx="7" ry="16" fill="none" stroke="#14b8a6" stroke-width="2.2"/>
    <path d="M-16 0 H16" stroke="#14b8a6" stroke-width="2.2"/>
    <path d="M-13 -8 H13" stroke="#14b8a6" stroke-width="1.6" opacity="0.7"/>
    <path d="M-13 8 H13" stroke="#14b8a6" stroke-width="1.6" opacity="0.7"/>
  </g>

  <!-- badge: chat bubble (right) -->
  <g transform="translate(332 198)">
    <circle r="30" fill="#ffffff" filter="url(#softShadow)"/>
    <path d="M-16 -10 h32 a6 6 0 0 1 6 6 v10 a6 6 0 0 1 -6 6 h-19 l-9 8 v-8 h-4 a6 6 0 0 1 -6 -6 v-10 a6 6 0 0 1 6 -6 Z" fill="#7c6ef4"/>
    <circle cx="-7" cy="0" r="2.2" fill="#ffffff"/>
    <circle cx="1" cy="0" r="2.2" fill="#ffffff"/>
    <circle cx="9" cy="0" r="2.2" fill="#ffffff"/>
  </g>

  <!-- badge: trophy (left) -->
  <g transform="translate(84 148)">
    <circle r="30" fill="#ffffff" filter="url(#softShadow)"/>
    <path d="M-10 -14 h20 v10 c0 7 -4.5 11 -10 11 s-10 -4 -10 -11 Z" fill="#f5a623"/>
    <path d="M-10 -10 h-6 c0 8 3 12 6 13" fill="none" stroke="#f5a623" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M10 -10 h6 c0 8 -3 12 -6 13" fill="none" stroke="#f5a623" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M0 7 v6" stroke="#f5a623" stroke-width="3" stroke-linecap="round"/>
    <path d="M-8 16 h16" stroke="#f5a623" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- badge: bar chart (bottom left) -->
  <g transform="translate(104 258)">
    <circle r="30" fill="#ffffff" filter="url(#softShadow)"/>
    <rect x="-15" y="0" width="8" height="14" rx="2" fill="#22c55e"/>
    <rect x="-4" y="-8" width="8" height="22" rx="2" fill="#22c55e"/>
    <rect x="7" y="-14" width="8" height="28" rx="2" fill="#22c55e"/>
  </g>
</svg>
